<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Registro de usuario</title>
    </head>
    <body>
        <!-- 
        -------------------------------------------
        TITULO DE LA PÁGINA
        -------------------------------------------
        -->
        <h1>Registo de usuario</h1>

        <!-- 
        -------------------------------------------
        FORMULARIO DE REGISTRO
        -------------------------------------------
        action:
            Archivo que recibira datos
        
        method:
            POST enviara la informacion de forma no visible
            en la URL
        -->
        <form action="registro.php" method="post">
            <!-- 
            -------------------------------------------
            NOMBRE
            -------------------------------------------
            -->
            <label for="nombre">Nombre: </label>
            <input type="text" name="nombre" id="nombre" required><br><br>

            <!-- 
            -------------------------------------------
            EMAIL
            -------------------------------------------
            type = "email"

            El navegador comprobara automaticamente que
            tenga formato de correo electronico.
            -->
            <label for="email">Email: </label>
            <input type="email" name="email" id="email" required><br><br>

            <!-- 
            -------------------------------------------
            CONTRASEÑA
            -------------------------------------------
            type = "password"

            Oculta los caracteres escritos
            -->
            <label for="password">Contraseña: </label>
            <input type="password" name="password" id="password" required><br><br>

            <!-- 
            -------------------------------------------
            BOTON DE ENVIO
            -------------------------------------------
            -->
            <button type="submit">Registrarse</button>
        </form>
    </body>
</html>
